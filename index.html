<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Juegos de Cartas</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <!-- Pantalla 1: menú principal (los modos se generan desde js/modos.js) -->
  <section id="pantalla-menu" class="pantalla menu">
    <h1>🃏 Juegos de Cartas</h1>
    <p class="subtitulo">Elige un modo de juego</p>
    <div id="lista-modos" class="lista-modos"></div>
    <button id="btn-opciones" class="secundario boton-opciones">⚙ Opciones</button>
  </section>

  <!-- Pantalla de opciones generales (js/config.js + js/pantalla-opciones.js) -->
  <section id="pantalla-opciones" class="pantalla" hidden>
    <header class="barra">
      <button id="opciones-volver" class="secundario" type="button">← Menú</button>
      <h1>⚙ Opciones</h1>
    </header>
    <form id="form-opciones" class="form-opciones">
      <fieldset>
        <legend>🤖 Nombres de las CPU</legend>
        <p class="ayuda">Se usan en todos los juegos: CPU 1 es el primer rival, CPU 2 el segundo, y así sucesivamente. Si dejas un campo vacío, se usa el nombre por defecto.</p>
        <div id="campos-nombres" class="campos"></div>
      </fieldset>
      <p id="opciones-estado" class="estado" role="status"></p>
      <div class="acciones">
        <button type="submit" class="primario">Guardar</button>
        <button type="button" id="opciones-restaurar" class="secundario">Restaurar por defecto</button>
      </div>
    </form>
  </section>

  <!-- Pantalla 2: partida (cada modo dibuja su juego dentro de #contenedor-juego) -->
  <section id="pantalla-juego" class="pantalla" hidden>
    <header class="barra">
      <button id="btn-menu" class="secundario">← Menú</button>
      <h1 id="titulo-modo"></h1>
      <button id="btn-reiniciar" class="secundario">Reiniciar</button>
    </header>
    <div id="contenedor-juego"></div>
  </section>

  <!-- Mensaje de fin de partida -->
  <dialog id="fin-partida">
    <h2 id="fin-titulo"></h2>
    <p id="fin-detalle"></p>
    <div class="acciones">
      <button id="fin-repetir" class="primario">Repetir juego</button>
      <button id="fin-menu" class="secundario">Volver al menú</button>
    </div>
  </dialog>

  <!-- El orden importa: base → registro de modos → cada modo → app -->
  <script src="js/config.js"></script>
  <script src="js/baraja.js"></script>
  <script src="js/dibujo.js"></script>
  <script src="js/modos.js"></script>
  <script src="js/modos/carta-alta/reglas.js"></script>
  <script src="js/modos/carta-alta/vista.js"></script>
  <script src="js/modos/P07o-suci0/reglas.js"></script>
  <script src="js/modos/P07o-suci0/vista.js"></script>
  <script src="js/pantalla-opciones.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
